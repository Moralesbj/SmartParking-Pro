# Local reproducible stack. Not a production deployment.
# Usage (from repository root): docker compose --env-file .env -f infrastructure/compose.yaml up -d --build
name: smartparking

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: smartparking
      POSTGRES_USER: ${DB_USER:-smartparking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d smartparking"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  ai-service:
    build: ../ai-service
    environment:
      ALPR_PROVIDER: ${ALPR_PROVIDER:-TEMPLATE_OCR}
      ALPR_SERVICE_TOKEN: ${ALPR_SERVICE_TOKEN:?Defina ALPR_SERVICE_TOKEN en .env}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]

  backend:
    build: ../backend
    depends_on:
      postgres: { condition: service_healthy }
      ai-service: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartparking
      DB_USER: ${DB_USER:-smartparking}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Defina APP_ENCRYPTION_KEY en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      ALPR_MODE: ${ALPR_MODE:-HTTP}
      ALPR_BASE_URL: http://ai-service:8000
      ALPR_SERVICE_TOKEN: ${ALPR_SERVICE_TOKEN}
      MAIL_MODE: ${MAIL_MODE:-DISABLED}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
    networks: [internal]

  frontend:
    build: ../frontend
    depends_on: [backend]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8088}:8080"
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
